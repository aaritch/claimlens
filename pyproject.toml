[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
# Adopt correctness checks across the legacy code without a formatting-only rewrite.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
files = ["claimlens/logging_safe.py", "claimlens/observability.py", "claimlens/analytics.py",
         "claimlens/integrations", "claimlens/storage/migrations.py", "claimlens/api/auth.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["claimlens"]

[tool.coverage.report]
show_missing = true
fail_under = 80
